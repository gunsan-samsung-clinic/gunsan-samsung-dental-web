<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>군산 삼성치과</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


<header>

<div class="logo">

<img src="clinic2.png">

<div>

<h1>군산 삼성치과</h1>

<p>건강한 미소를 위한 선택</p>

</div>

</div>

</header>

<nav class="section-nav">
  <a href="#sec-tips" class="section-nav-btn"><span class="tab-icon">🦷</span><span class="tab-label">치아상식</span></a>
  <a href="#sec-reels" class="section-nav-btn"><span class="tab-icon">🎬</span><span class="tab-label">릴스</span></a>
  <a href="#sec-events" class="section-nav-btn"><span class="tab-icon">🎁</span><span class="tab-label">이벤트</span></a>
  <a href="#sec-news" class="section-nav-btn"><span class="tab-icon">📢</span><span class="tab-label">공지사항</span></a>
  <a href="#sec-questions" class="section-nav-btn"><span class="tab-icon">❓</span><span class="tab-label">질의문답</span></a>
  <a href="#sec-reviews" class="section-nav-btn"><span class="tab-icon">⭐</span><span class="tab-label">후기</span></a>
</nav>

<div class="container">


<!-- 1분 치아상식 -->

<section class="content-card" id="sec-tips">

<h2>
🦷 1분 치아상식
</h2>

<div class="video-card">

<img src="clinic1.jpg">

<p>
치아 건강 정보를 확인하세요
</p>

</div>

</section>




<!-- 릴스 -->

<section class="content-card" id="sec-reels">


<h2>
🎬 릴스
</h2>


<div class="hero-video">

<video
id="reelPlayer"
autoplay
muted
playsinline>
</video>

</div>


</section>





<!-- 이벤트 -->


<section class="content-card" id="sec-events">


<h2>
🎁 이벤트
</h2>


<div id="eventList"></div>


</section>





<!-- 공지 -->

<section class="content-card" id="sec-news">


<h2>
📢 공지사항
</h2>


<div id="newsList"></div>


</section>





<!-- 질의문답 -->

<section class="content-card" id="sec-questions">


<h2>
❓ 질의문답
</h2>


<div id="questionList"></div>

<form id="questionForm" class="admin-form">
  <textarea id="questionText" placeholder="궁금하신 점을 남겨주세요" required></textarea>
  <button type="submit">질문 남기기</button>
</form>
<p id="questionSuccess" class="success-text hidden">질문이 접수되었습니다. 답변 후 게시됩니다.</p>
<p id="questionError" class="error-text hidden">질문 등록에 실패했습니다. 잠시 후 다시 시도해주세요.</p>

</section>





<!-- 후기 -->

<section class="content-card" id="sec-reviews">


<h2>
⭐ 후기
</h2>


<div id="reviewList"></div>

<form id="reviewForm" class="admin-form">
  <input type="text" id="reviewWriter" placeholder="이름 (닉네임 가능)" required>
  <textarea id="reviewContent" placeholder="이용 후기를 남겨주세요" required></textarea>
  <button type="submit">후기 남기기</button>
</form>
<p id="reviewSuccess" class="success-text hidden">소중한 후기 감사합니다. 확인 후 게시됩니다.</p>
<p id="reviewError" class="error-text hidden">후기 등록에 실패했습니다. 잠시 후 다시 시도해주세요.</p>

</section>




</div>


<script type="module" src="app.js"></script>


</body>
